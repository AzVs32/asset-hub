# Asset Hub configuration example.
#
# Runtime lookup order:
# - If ASSET_HUB_CONFIG is set, asset-http reads that file.
# - Otherwise asset-http tries ./config.toml.
# - If ./config.toml does not exist, built-in defaults are used.
#
# HTTP entrypoint settings are currently environment variables, not TOML:
# - ASSET_HTTP_ADDR=127.0.0.1:8080
# - ASSET_HUB_CONFIG=config.toml
# - ASSET_HTTP_ENABLE_SWAGGER=true
# - ASSET_HTTP_ENABLE_PURGE=true
# - ASSET_HTTP_CORS_ALLOWED_ORIGINS=http://127.0.0.1:5173
# - ASSET_HTTP_REQUEST_TIMEOUT_SECS=30

[database]
# SQLite database file path.
# Relative paths are resolved from the current working directory.
sqlite_path = "data/asset-hub.sqlite"

# SQLite connection pool size.
max_connections = 5

[blob]
# OpenDAL Fs backend root directory.
# Relative paths are resolved from the current working directory.
fs_root = "data/blob"

[kind]
# Optional plugin JSON manifest files.
# Manifest files are loaded at startup; restart the service after adding/removing plugins.
plugin_manifests = []

# Optional system-configured resource kinds.
# Built-in kinds are always available and cannot be overridden.
#
# [[kind.definitions]]
# kind = "doc:note"
# label = "Note"
# schema_id = "doc:note@1"
# supports_content = false
# metadata_schema = { type = "object" }

# Plugin manifest example.
# Use `capabilities.resource_kinds` for new resource types, and flat
# `capabilities.resource_actions` with `applies_to.kinds` for actions.
#
# {
#   "manifest_version": 1,
#   "plugin": {
#     "id": "example.tools",
#     "name": "Example Tools",
#     "version": "0.1.0",
#     "publisher": "example",
#     "description": "Example external plugin."
#   },
#   "runtime": {
#     "type": "extism",
#     "wasm": "example-tools.wasm",
#     "wasi": false,
#     "plugin_api": "asset-hub.plugin-api@0.1"
#   },
#   "capabilities": {
#     "resource_kinds": [
#       {
#         "kind": "example:document",
#         "label": "Document",
#         "schema_id": "example:document@1",
#         "supports_content": true
#       }
#     ],
#     "resource_actions": [
#       {
#         "id": "example:summarize",
#         "label": "Summarize",
#         "executor": {
#           "type": "plugin",
#           "handler": "summarize"
#         },
#         "applies_to": {
#           "kinds": ["example:document"]
#         },
#         "access": "read"
#       },
#       {
#         "id": "example:play_mp4",
#         "label": "Play MP4",
#         "executor": {
#           "type": "plugin",
#           "handler": "play_mp4"
#         },
#         "applies_to": {
#           "kinds": ["core:video"],
#           "media_types": ["video/mp4"],
#           "extensions": [".mp4", ".m4v"]
#         },
#         "access": "read"
#       }
#     ]
#   },
#   "permissions": {
