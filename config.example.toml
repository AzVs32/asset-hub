# Asset Hub configuration example.
#
# Runtime lookup order:
# - If ASSET_HUB_CONFIG is set, asset-http reads that file.
# - Otherwise asset-http tries ./config.toml.
# - If ./config.toml does not exist, built-in defaults are used.
#
# HTTP entrypoint settings are currently environment variables, not TOML:
# - ASSET_HTTP_ADDR=127.0.0.1:8080
# - ASSET_HUB_CONFIG=config.toml
# - ASSET_HTTP_ENABLE_SWAGGER=true
# - ASSET_HTTP_ENABLE_PURGE=true
# - ASSET_HTTP_CORS_ALLOWED_ORIGINS=http://127.0.0.1:5173 (explicit origins only)
# - ASSET_HTTP_REQUEST_TIMEOUT_SECS=30
# - ASSET_HTTP_COOKIE_SECURE=false (must be true behind public HTTPS)
# - ASSET_HTTP_SESSION_INACTIVITY_SECS=43200

[database]
backend = "sqlite"

[database.sqlite]
# SQLite connection pool size.
max_connections = 5
# SQLite is always stored at <blob.local.root>/.asset-hub/asset-hub.sqlite so database metadata
# and Blob content can be migrated as one data domain.

[blob]
backend = "local"

[blob.local]
# Local Blob storage root directory.
# Relative paths are resolved from the current working directory.
root = "data"

[blob.local.sync]
# Keep the Resource database synchronized with changes made through the operating system.
enabled = true
# Coalesce bursts produced by editors and file managers before recalculating checksums.
debounce_milliseconds = 1000
# Periodically reconcile the complete tree to recover changes missed while the app was stopped.
reconcile_interval_seconds = 1800

[plugin]
# Hard execution budgets applied to every plugin call.
max_content_bytes = 67108864
# Content at or below this threshold may be embedded in the action JSON payload.
max_inline_content_bytes = 4194304
# Maximum raw byte chunk returned by one Wasm content_read call.
max_content_read_bytes = 4194304
max_input_bytes = 8388608
max_output_bytes = 8388608
max_concurrent_calls = 8
memory_max_pages = 4096
timeout_seconds = 20

[plugin.grants]
# A Manifest requests external access; the host grants it independently here.
# Requested hosts require exact matches. Wildcards are rejected.
network_hosts = []
# Filesystem requests must be absolute paths below one of these normalized roots.
filesystem_read = []
filesystem_write = []

[kind]
# Optional plugin JSON manifest files.
# Manifest files are loaded at startup; restart the service after adding/removing plugins.
plugin_manifests = []

# Optional system-configured resource kinds.
# Built-in kinds are always available and cannot be overridden.
#
# [[kind.definitions]]
# kind = "doc:note"
# parent = "core:document"
# label = "Note"
# supports_content = false

# Arbitrarily deep hierarchy example. Actions declared for `core:document`
# are inherited by `core:code`, `code:c`, and `code:cpp`.
# [[kind.definitions]]
# kind = "core:code"
# parent = "core:document"
# label = "Source Code"
# supports_content = true
#
# [[kind.definitions]]
# kind = "code:c"
# parent = "core:code"
# label = "C"
# supports_content = true
# detect = { mime_types = ["text/x-c"], extensions = [".c", ".h"] }
#
# [[kind.definitions]]
# kind = "code:cpp"
# parent = "core:code"
# label = "C++"
# supports_content = true
# detect = { mime_types = ["text/x-c++"], extensions = [".cc", ".cpp", ".cxx", ".hpp"] }

# Plugin manifest example.
# Use `capabilities.kinds` for resource types, `capabilities.directory_kinds` for
# directory types, and `capabilities.actions` for resource actions.
# Author a Manifest V3 JSON document, then build the declared artifacts.
# Artifact hashes belong to the generated sibling `manifest.lock.json`; generate it with
# `asset plugin --seal path/to/plugin.json` after building the plugin artifacts.
#
# {
#   "$schema": "https://asset-hub.local/schemas/plugin-manifest-v3.json",
#   "manifest_version": 3,
#   "plugin": {
#     "id": "example.tools",
#     "name": "Example Tools",
#     "version": "0.1.0",
#     "publisher": "example",
#     "description": "Example external plugin."
#   },
#   "runtime": {
#     "type": "extism",
#     "wasm": "example-tools.wasm"
#   },
#   "capabilities": {
#     "kinds": [
#       {
#         "kind": "example:document",
#         "label": "Document",
#         "supports_content": true
#       }
#     ],
#     "actions": [
#       {
#         "id": "example.tools.summarize",
#         "label": "Summarize",
#         "handler": "summarize",
#         "applies_to": {
#           "kinds": ["example:document"]
#         },
#         "access": "read",
#         "requires": {
#           "content": true,
#           "content_delivery": "reference"
#         },
#         "views": ["json"]
#       }
#     ]
#   },
#   "permissions": {
#     "allow": ["resource.read", "content.read"]
#   }
# }
