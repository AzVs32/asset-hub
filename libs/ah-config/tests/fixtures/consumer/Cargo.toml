[package]
name = "ah-config-consumer"
version = "0.0.0"
edition = "2024"
publish = false
default-run = "ah-config-consumer"

[workspace]
resolver = "3"
members = ["extension"]

[dependencies]
settings = { package = "ah-config", path = "../../.." }
config-extension = { path = "extension" }
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
