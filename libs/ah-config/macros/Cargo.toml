[package]
name = "ah-config-macros"
version = "0.2.0"
edition = "2024"
rust-version = "1.94.1"
license = "Apache-2.0"
repository = "https://github.com/AzVs32/asset-hub"
authors = ["AzVs"]
description = "Derive implementation for ah-config"
readme = "README.md"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "2.0.119", features = ["full"] }
proc-macro-crate = "3.5.0"

[lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
panic = "warn"
