# Container paths. Configuration lives under /conf; runtime state and file content live under /data.
# SQLite is fixed at <blob.local.root>/.asset-hub/asset-hub.sqlite.
[database]
backend = "sqlite"

[database.sqlite]
max_connections = 5

[blob]
backend = "local"

[blob.local]
root = "/data"

[blob.local.sync]
enabled = true
debounce_milliseconds = 1000
reconcile_interval_seconds = 1800

[kind]
plugin_manifests = [
  "/app/plugins/azvs-markdown/manifest.json",
  "/app/plugins/azvs-epub/manifest.json",
]
