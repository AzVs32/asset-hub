[package]
name = "infra"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "asset_infra"

[dependencies]
asset-vfs.workspace = true
cap-std = "3.4.5"
async-trait.workspace = true
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite", "runtime-tokio", "macros", "migrate"] }

[dev-dependencies]
asset-vfs-conformance.workspace = true
tempfile = "3.27.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
