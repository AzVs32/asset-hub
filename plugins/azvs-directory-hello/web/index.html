<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello Directory</title>
    <style>
      :root {
        color: #172033;
        background: #f6f8fc;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-synthesis: none;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px;
        background:
          radial-gradient(circle at 20% 10%, rgb(82 125 255 / 14%), transparent 34%),
          radial-gradient(circle at 85% 80%, rgb(28 194 154 / 10%), transparent 32%),
          #f6f8fc;
      }

      main {
        width: min(100%, 620px);
        padding: clamp(32px, 6vw, 64px);
        text-align: center;
        background: rgb(255 255 255 / 88%);
        border: 1px solid rgb(207 217 235 / 85%);
        border-radius: 28px;
        box-shadow: 0 24px 70px rgb(35 55 94 / 12%);
        backdrop-filter: blur(16px);
      }

      .mark {
        width: 72px;
        height: 72px;
        display: grid;
        place-items: center;
        margin: 0 auto 24px;
        color: white;
        font-size: 34px;
        font-weight: 700;
        background: linear-gradient(145deg, #2f6df6, #5c8cff);
        border-radius: 22px;
        box-shadow: 0 14px 30px rgb(47 109 246 / 28%);
      }

      .eyebrow {
        display: inline-flex;
        margin-bottom: 18px;
        padding: 7px 12px;
        color: #36518b;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        background: #edf3ff;
        border: 1px solid #dce7ff;
        border-radius: 999px;
      }

      h1 {
        margin: 0;
        font-size: clamp(32px, 6vw, 48px);
        line-height: 1.08;
        letter-spacing: -0.04em;
      }

      p {
        max-width: 460px;
        margin: 18px auto 0;
        color: #64718a;
        font-size: 16px;
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">D</div>
      <div class="eyebrow">azvs.directory.hello</div>
      <h1>Hello, Directory!</h1>
      <p>This workspace is rendered entirely by the demo Directory plugin.</p>
    </main>
  </body>
</html>
