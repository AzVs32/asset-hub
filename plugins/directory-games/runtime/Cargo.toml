[package]
name = "directory-games-plugin"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
asset-plugin-sdk = { path = "../../../asset-plugin-sdk", features = ["extism-guest"] }
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
usvg = { version = "0.48.1", default-features = false, features = ["writer"] }

[profile.release]
lto = true
opt-level = "z"
strip = true

[workspace]
