[package]
name = "azvs-epub-plugin"
version = "0.4.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
ammonia = "4.1.4"
asset-plugin-sdk = { path = "../../../asset-plugin-sdk", features = ["extism-guest"] }
base64 = "0.23.1"
lol_html = "3.0.1"
roxmltree = "0.21.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[profile.release]
lto = true
opt-level = "z"
strip = true

[workspace]
