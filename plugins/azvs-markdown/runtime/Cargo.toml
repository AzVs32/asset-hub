[package]
name = "azvs-markdown-plugin"
version = "0.4.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
asset-plugin-api = { path = "../../../asset-plugin-api", features = ["extism-guest"] }
base64 = "0.23.1"
extism-pdk = "1.4.1"
serde_json = "1.0.151"

[profile.release]
lto = true
opt-level = "z"
strip = true

[workspace]
