[package]
name = "vfs-driver-webdav"
description = "Portable WebDAV VFS Component Model plugin"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/AzVs32/asset-hub"
authors = ["AzVs"]

[lib]
crate-type = ["cdylib", "rlib"]

[workspace]
resolver = "3"

[lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
panic = "warn"

[dependencies]
vfs-plugin-protocol = { path = "../../crates/vfs-plugin-protocol", version = "0.1.0" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
wit-bindgen = "0.63"
base64 = "0.22.1"
url = "2.5.8"
percent-encoding = "2.3.2"
quick-xml = "0.38.4"
time = { version = "0.3", features = ["parsing"] }

