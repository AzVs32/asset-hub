[package]
name = "vfs-driver-webdav"
description = "Portable WebDAV VFS Component Model plugin"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
vfs-plugin-protocol = { path = "../../crates/vfs-plugin-protocol", version = "0.1.0" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
wit-bindgen = "0.63"
base64 = "0.22.1"
url = "2.5.8"
percent-encoding = "2.3.2"
quick-xml = "0.38.4"
time = { version = "0.3", features = ["parsing"] }

