[package]
name = "vfs-driver-local-linux"
description = "Linux local-filesystem gRPC plugin for Asset Hub VFS"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ah-id = { workspace = true, features = ["uuid_v7"] }
vfs-driver-kit = { path = "../../crates/vfs-driver-kit", version = "0.1.0" }
ah-config = "0.2.0"
ah-vfs = { path = "../../crates/ah-vfs", version = "0.1.0" }
vfs-plugin-grpc-server = { path = "../../crates/vfs-plugin-grpc-server", version = "0.1.0" }
cap-std = "3.4.6"
cap-fs-ext = "3.4.6"
rustix = { version = "1.1.5", features = ["fs"] }
semver.workspace = true
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite-bundled", "runtime-tokio"] }
thiserror.workspace = true
tokio = { version = "1.54.1", features = ["fs", "rt"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
vfs-plugin-grpc = { path = "../../crates/vfs-plugin-grpc", version = "0.1.0" }
ah-vfs = { path = "../../crates/ah-vfs", features = ["testing"] }
vfs-plugin-host = { path = "../../crates/vfs-plugin-host", version = "0.1.0" }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt"] }
