[workspace]
resolver = "3"
members = [
    "asset-plugin-api",
    "asset-core",
    "asset-infra",
    "asset-runtime",
    "asset-http",
    "asset-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["AzVs"]

[workspace.dependencies]
asset-plugin-api = { path = "asset-plugin-api" }
asset-core = { path = "asset-core"}
asset-infra = { path = "asset-infra" }
asset-runtime = { path = "asset-runtime" }

anyhow = "1.0.104"
comfy-table = "8.0.0"
indicatif = "0.18.6"
rpassword = "7.5.4"
thiserror = "2.0.20"
uuid = { version = "1.24.0", features = ["v7", "serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.4"
sha2 = "0.11.0"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive"] }
async-trait = "0.1.92"
bytes = "1.12.1"
axum = "0.8.9"
argon2 = "0.5.3"
axum-login = "0.18.0"
base64 = "0.23.1"
config = { version = "0.15.25", default-features = false, features = ["toml"] }
futures-core = "0.3.33"
futures-util = "0.3.33"
extism = { version = "1.30.0", default-features = false, features = ["register-filesystem", "wasmtime-default-features"] }
opendal = { version = "0.58.1", default-features = false, features = ["services-fs"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "chrono", "uuid", "json", "macros", "migrate"] }
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7.19", features = ["io"] }
tempfile = "3.27.0"
notify = "8.2.0"
time = "0.3.55"
tower = { version = "0.5.3", features = ["util"] }
tower-sessions = "0.14.0"
tower-sessions-sqlx-store = { version = "0.15.0", features = ["sqlite"] }
tower-http = { version = "0.7.0", features = ["cors", "timeout", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
utoipa = "5.5.0"
utoipa-swagger-ui = { version = "9.0.2", features = ["axum", "vendored"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
