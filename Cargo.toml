[workspace]
resolver = "3"
members = [
    "crates/ah-vfs",
    "crates/ah-vfs-storage",
    "crates/vfs-driver-memory",
    "crates/vfs-plugin-protocol",
    "crates/vfs-plugin-guest",
    "crates/vfs-plugin-codec",
    "crates/vfs-plugin-host",
    "crates/vfs-plugin-grpc-wire",
    "crates/vfs-plugin-grpc",
    "crates/vfs-plugin-grpc-server",
    "crates/vfs-plugin-wasm",
    "crates/vfs-plugin-loader",
]
exclude = ["libs", "plugins", "crates-local"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/AzVs32/asset-hub"
authors = ["AzVs"]

[workspace.dependencies]
ah-id = "0.1.0"
bon = "3.10.2"
getset = "0.1.7"
derive_more = { version = "2.1.1", default-features = false }
thiserror = "2.0.21"
semver = "1.0.28"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
panic = "warn"
