[workspace]
resolver = "3"
members = [
    "asset-core",
    "asset-infra",
    "asset-apps"
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["AzVs"]

[workspace.dependencies]
asset-core = { path = "asset-core"}
asset-infra = { path = "asset-infra" }

thiserror = "2.0.18"
uuid = { version = "1.23.3", features = ["v7", "serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
chrono = { version = "0.4.45", features = ["serde"] }
async-trait = "0.1.89"
bytes = "1.12.0"
axum = "0.8.9"
base64 = "0.22.1"
config = { version = "0.15.25", default-features = false, features = ["toml"] }
futures-core = "0.3.32"
futures-util = "0.3.32"
opendal = { version = "0.57.0", default-features = false, features = ["services-fs"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "chrono", "uuid", "json", "macros", "migrate"] }
tokio = { version = "1.48.0", features = ["macros", "net", "rt-multi-thread"] }
tower = { version = "0.5.2", features = ["util"] }
utoipa = "5.5.0"
utoipa-swagger-ui = { version = "9.0.2", features = ["axum", "vendored"] }
