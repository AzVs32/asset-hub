[workspace]
resolver = "3"
members = [
    "asset-plugin-api",
    "asset-core",
    "asset-infra",
    "asset-runtime",
    "asset-http",
    "asset-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["AzVs"]

[workspace.dependencies]
asset-plugin-api = { path = "asset-plugin-api" }
asset-core = { path = "asset-core"}
asset-infra = { path = "asset-infra" }
asset-runtime = { path = "asset-runtime" }

anyhow = "1.0.100"
comfy-table = "7.2.2"
rpassword = "7.4.0"
thiserror = "2.0.18"
uuid = { version = "1.23.3", features = ["v7", "serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
toml = "0.9.12"
sha2 = "0.10.9"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.5.54", features = ["derive"] }
async-trait = "0.1.89"
bytes = "1.12.0"
axum = "0.8.9"
argon2 = "0.5.3"
axum-login = "0.18.0"
base64 = "0.22.1"
config = { version = "0.15.25", default-features = false, features = ["toml"] }
futures-core = "0.3.32"
futures-util = "0.3.32"
extism = { version = "1.30.0", default-features = false, features = ["register-filesystem", "wasmtime-default-features"] }
opendal = { version = "0.57.0", default-features = false, features = ["services-fs"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "chrono", "uuid", "json", "macros", "migrate"] }
tokio = { version = "1.48.0", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7.18", features = ["io"] }
tempfile = "3.27.0"
notify = "8.2.0"
time = "0.3.53"
tower = { version = "0.5.2", features = ["util"] }
tower-sessions = "0.14.0"
tower-sessions-sqlx-store = { version = "0.15.0", features = ["sqlite"] }
tower-http = { version = "0.6.6", features = ["cors", "timeout", "trace"] }
tracing = "0.1.42"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }
utoipa = "5.5.0"
utoipa-swagger-ui = { version = "9.0.2", features = ["axum", "vendored"] }
zip = { version = "3.0.0", default-features = false, features = ["deflate"] }
