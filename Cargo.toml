[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["libs"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/AzVs32/asset-hub"
authors = ["AzVs"]

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
panic = "warn"
