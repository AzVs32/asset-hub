[workspace]
resolver = "3"
members = [
    "asset-core",
    "asset-apps"
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["AzVs"]

[workspace.dependencies]
asset-core = { path = "asset-core"}

thiserror = "2.0.18"
uuid = { version = "1.23.3", features = ["v7", "serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
chrono = { version = "0.4.45", features = ["serde"] }
async-trait = "0.1.89"
bytes = "1.12.0"
