name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo test --manifest-path plugins/azvs-markdown/plugin/Cargo.toml
      - run: cargo test --manifest-path plugins/azvs-epub/Cargo.toml
      - run: cargo test --manifest-path plugins/azvs-mp4/Cargo.toml

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            asset-web-admin/package-lock.json
            plugins/azvs-markdown/web/package-lock.json
      - working-directory: asset-web-admin
        run: npm ci
      - working-directory: asset-web-admin
        run: npm test
      - working-directory: asset-web-admin
        run: npm run lint && npm run build
      - working-directory: plugins/azvs-markdown/web
        run: npm ci
      - working-directory: plugins/azvs-markdown/web
        run: npm run typecheck && npm run build
