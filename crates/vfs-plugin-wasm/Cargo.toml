[package]
name = "vfs-plugin-wasm"
description = "WIT Component Model host for VFS plugins"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
ah-vfs = { path = "../ah-vfs", version = "0.1.0" }
vfs-plugin-protocol = { path = "../vfs-plugin-protocol", version = "0.1.0" }
vfs-plugin-host = { path = "../vfs-plugin-host", version = "0.1.0" }
serde = "1.0.229"
wasmtime = { version = "50", default-features = false, features = ["async", "component-model", "cranelift", "runtime", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tokio = { version = "1.54.1", features = ["rt", "sync", "time"] }

wasmtime-wasi = { version = "50.0.1", default-features = false, features = ["p2"] }
wasmtime-wasi-http = { version = "50.0.1", default-features = false, features = ["p2"] }
wasmtime-wasi-io = { version = "50.0.1", default-features = false, features = ["std"] }
url = "2.5.8"
bytes = "1.12.1"
http = "1.5.0"
http-body-util = "0.1.3"

[dev-dependencies]
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "test-util", "net", "io-util"] }
wat = "1.262"
wit-parser = "0.262"
wit-component = "0.262"

