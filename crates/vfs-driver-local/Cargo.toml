[package]
name = "vfs-driver-local"
description = "Local-directory driver for Asset Hub VFS"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
ah-id = { workspace = true, features = ["uuid_v7"] }
vfs-driver-kit = { path = "../vfs-driver-kit", version = "0.1.0" }
ah-config = "0.2.0"
ah-vfs = { path = "../ah-vfs", version = "0.1.0" }
cap-std = "3.4.6"
cap-fs-ext = "3.4.6"
semver.workspace = true
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite-bundled", "runtime-tokio"] }
thiserror.workspace = true
tokio = { version = "1.54.1", features = ["fs", "rt"] }

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
rustix = { version = "1.1.5", features = ["fs"] }

[dev-dependencies]
ah-vfs = { path = "../ah-vfs", features = ["testing"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt"] }
