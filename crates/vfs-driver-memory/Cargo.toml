[package]
name = "vfs-driver-memory"
description = "Capacity-limited in-memory storage driver for Asset Hub VFS"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
ah-vfs = { path = "../ah-vfs", version = "0.1.0" }
ah-vfs-storage = { path = "../ah-vfs-storage", version = "0.1.0" }
ah-id = { workspace = true, features = ["uuid_v7"] }
semver.workspace = true
serde_json = "1.0.154"
thiserror.workspace = true
tokio = { version = "1.54.1", features = ["sync"] }

[dev-dependencies]
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite-bundled", "runtime-tokio"] }
ah-vfs = { path = "../ah-vfs", features = ["testing"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync"] }
