[package]
name = "vfs-integration-tests"
description = "Cross-driver integration tests for Asset Hub VFS"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dev-dependencies]
ah-vfs = { path = "../ah-vfs", features = ["testing"] }
vfs-plugin-grpc = { path = "../vfs-plugin-grpc", version = "0.1.0" }
vfs-plugin-grpc-server = { path = "../vfs-plugin-grpc-server", version = "0.1.0" }
vfs-plugin-host = { path = "../vfs-plugin-host", version = "0.1.0" }
vfs-driver-memory = { path = "../vfs-driver-memory", version = "0.1.0" }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite-bundled", "runtime-tokio"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
vfs-driver-local-linux = { path = "../../plugins/vfs-driver-local-linux", version = "0.1.0" }

[target.'cfg(target_os = "windows")'.dev-dependencies]
vfs-driver-local-windows = { path = "../../plugins/vfs-driver-local-windows", version = "0.1.0" }
