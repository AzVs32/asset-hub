syntax = "proto3";
package assethub.vfs.v15;

// The sole plugin message schema, shared by gRPC and the WASM call export.
// Request/Reply control fields are limited to 1 MiB, data to 8 MiB. Missing
// operations, results, required message fields and unknown resource kinds fail
// validation. Optional fields distinguish absence from zero and empty values.
message Empty {}

// Lossless dynamic settings and JSON Schema values. Unlike protobuf Struct,
// integers never pass through double; uint64 and sint64 retain all 64 bits.
// Values may nest at most 24 levels. Missing kinds and non-finite reals fail.
message Object { map<string, JsonValue> fields = 1; }
message Array { repeated JsonValue values = 1; }
message JsonValue {
  oneof kind {
    Empty null_value = 1;
    bool boolean = 2;
    string text = 3;
    sint64 integer = 4;
    uint64 unsigned_integer = 5;
    double real = 6; // Must be finite.
    Object object = 7;
    Array array = 8;
  }
}
enum Capability {
  CAPABILITY_UNSPECIFIED = 0; CAPABILITY_STAT = 1; CAPABILITY_LIST = 2;
  CAPABILITY_READ = 3; CAPABILITY_RANGE_READ = 4;
  CAPABILITY_WRITE_NEW = 5; CAPABILITY_WRITE_REPLACE = 6; CAPABILITY_ATOMIC_PUBLISH = 7;
  CAPABILITY_HIERARCHICAL = 8; CAPABILITY_PREFIX = 9; CAPABILITY_EMPTY_DIRS = 10;
  CAPABILITY_CREATE_DIR = 11; CAPABILITY_REMOVE = 12;
  CAPABILITY_RENAME_NEW = 13; CAPABILITY_RENAME_REPLACE = 14;
  CAPABILITY_PERMISSIONS_READ = 15; CAPABILITY_PERMISSIONS_WRITE = 16;
  CAPABILITY_XATTRS_READ = 17; CAPABILITY_XATTRS_WRITE = 18;
  CAPABILITY_READ_LINK = 19; CAPABILITY_FINAL_SLOT_ATOMIC = 20;
}
enum EntryKind {
  ENTRY_KIND_UNSPECIFIED = 0; ENTRY_KIND_FILE = 1; ENTRY_KIND_DIR = 2;
  ENTRY_KIND_SYMLINK = 3; ENTRY_KIND_OTHER = 4;
}
enum ResourceKind {
  RESOURCE_KIND_UNSPECIFIED = 0; RESOURCE_KIND_STORAGE = 1;
  RESOURCE_KIND_READER = 2; RESOURCE_KIND_WRITER = 3;
  RESOURCE_KIND_LOOKUP = 4;
}
enum XattrWriteMode {
  XATTR_WRITE_MODE_UNSPECIFIED = 0; XATTR_WRITE_MODE_UPSERT = 1;
  XATTR_WRITE_MODE_CREATE_NEW = 2; XATTR_WRITE_MODE_REPLACE = 3;
}
// Control-plane failures have no storage operation or mutation outcome.
enum FailureCode {
  FAILURE_CODE_UNSPECIFIED = 0;
  FAILURE_CODE_STORAGE = 1;
  FAILURE_CODE_INVALID_REQUEST = 2;
  FAILURE_CODE_TOO_LARGE = 3;
  FAILURE_CODE_PROTOCOL_VIOLATION = 4;
  FAILURE_CODE_INSTANCE_NOT_FOUND = 5;
  FAILURE_CODE_INVALID_INSTANCE_CONFIG = 6;
  FAILURE_CODE_LIFECYCLE_INVALID_RECORD = 7;
  FAILURE_CODE_LIFECYCLE_INVALID_REQUEST = 8;
  FAILURE_CODE_LIFECYCLE_INVALID_DECLARATION = 9;
  FAILURE_CODE_LIFECYCLE_UNSUPPORTED = 10;
  FAILURE_CODE_LIFECYCLE_CONFLICT = 11;
  FAILURE_CODE_LIFECYCLE_UNAVAILABLE = 12;
  FAILURE_CODE_LIFECYCLE_TIMED_OUT = 13;
  FAILURE_CODE_LIFECYCLE_BACKEND = 14;
  FAILURE_CODE_LIFECYCLE_ACCESS_DENIED = 15;
  FAILURE_CODE_LIFECYCLE_STALE = 16;
  FAILURE_CODE_LIFECYCLE_CAPACITY_EXCEEDED = 17;
  FAILURE_CODE_LIFECYCLE_CANCELLED = 18;
}
enum MutationOutcome {
  MUTATION_OUTCOME_UNSPECIFIED = 0;
  MUTATION_OUTCOME_UNCHANGED = 1;
  MUTATION_OUTCOME_UNKNOWN = 2;
}
message StorageFailure {
  string operation = 1;
  string family = 2;
  string reason = 3;
  MutationOutcome outcome = 4;
}
enum ConfigErrorKind {
  CONFIG_ERROR_KIND_UNSPECIFIED = 0; CONFIG_ERROR_KIND_MISSING_FIELD = 1;
  CONFIG_ERROR_KIND_UNKNOWN_FIELD = 2; CONFIG_ERROR_KIND_INVALID_TYPE = 3;
  CONFIG_ERROR_KIND_INVALID_VALUE = 4;
}
message Failure {
  FailureCode code = 1;
  optional string field = 2; // Safe configuration field identifier, never a value.
  optional ConfigErrorKind config_kind = 3;
  StorageFailure storage = 4;
}
message Description {
  uint32 major = 1; uint32 minor = 2; // This schema uses major 14, minor 0.
  // Feature identifiers: streams.chunked.v1.
  // Unknown required identifiers reject loading; optional ones grant no support.
  repeated string required_features = 3;
  repeated string features = 4;
  // Required WASI grants: http, tcp, fs.read, fs.write, env.
  repeated string required_host_capabilities = 5;
  // Required schema contract, negotiated independently of optional features.
  string instance_schema_profile = 6; // assethub.config.annotations.v1
  string generation = 7;
  string key = 8; string name = 9; string version = 10;
  bool child_mounts = 11;
  // Unknown numeric capabilities grant no support. Read modes and dir models
  // are exclusive; writable attributes require their corresponding read flag.
  repeated Capability capabilities = 12;
  Object settings_schema = 13; Object instance_schema = 14;
  uint32 config_version = 15; // Positive schema version, independent of protocol/software.
}
// Capabilities are declared only in Description. Chunk size must be 1..8 MiB
// and remains stable for the opened handle.
message StorageInfo {
  reserved 1;
  reserved "capabilities";
  uint32 chunk_size = 2;
}
message Timestamp { sint64 seconds = 1; uint32 nanos = 2; } // nanos < 1,000,000,000.
message Entry {
  string path = 1; EntryKind kind = 2;
  optional uint64 size = 3; Timestamp modified = 4;
}
message ResourceRef { ResourceKind kind = 1; uint64 handle = 2; }
message Initialize { Object settings = 1; }
message Config { Object config = 1; }
message Migrate { uint32 from_version = 1; Object config = 2; }
message Open { string id = 1; Object config = 2; } // config is required; absence is InvalidRequest.
// Each lookup belongs to the enclosing session generation. Observation IDs
// are issued by the plugin and are usable only in the lookup that issued them.
// The purpose identifies the storage operation for the lookup and its errors.
message LookupHandle { uint64 handle = 1; string purpose = 2; }
message ObserveChild { uint64 lookup = 1; uint64 parent = 2; string name = 3; string purpose = 4; }
// A traversal read omits final_slot. Execution includes the bound parent,
// exact name and canonical request address and verifies the observations.
message ReadObservedLink { uint64 lookup = 1; uint64 entry = 2; EntrySlot final_slot = 3; string purpose = 4; }
message EntrySlot { uint64 parent = 1; string name = 2; string path = 3; }
message ObservedEntry { uint64 id = 1; Entry entry = 2; }
message OpenedLookup { uint64 handle = 1; ObservedEntry root = 2; }
// References to plugin-issued observations within one lookup. An omitted
// entry for a final slot represents a name that was observed missing.
message BoundSlot { EntrySlot slot = 1; optional uint64 entry = 2; }
message BoundTarget { EntrySlot slot = 1; uint64 entry = 2; } // slot absent only for root
message BoundRead { BoundSlot target = 1; uint64 offset = 2; optional uint64 length = 3; }
message BoundWrite { BoundSlot target = 1; WriteMode mode = 2; Publication publication = 3; }
message BoundRemove { BoundSlot target = 1; Remove.Kind kind = 2; }
message BoundRename { BoundSlot source = 1; BoundSlot destination = 2; Rename.Mode mode = 3; }
message BoundList { BoundTarget target = 1; uint32 size = 2; }
message BoundCall {
  uint64 lookup = 1;
  oneof operation {
    BoundTarget stat = 2;
    BoundRead read = 3;
    BoundWrite write = 4;
    BoundSlot create_directory = 5;
    BoundRemove remove = 6;
    BoundRename rename = 7;
    BoundList select_directory = 8;
  }
}
message DirectorySelection { string address = 1; bytes identity = 2; }
// A live pagination position. The backend verifies the selection on resume.
message DirectoryCheckpoint { DirectorySelection selection = 1; string after = 2; }
// Selection is a separate exchange from enumeration.
message List {
  DirectorySelection selection = 1;
  optional string after = 2;
  uint32 size = 3;
}
message Remove {
  enum Kind { KIND_UNSPECIFIED = 0; NON_DIRECTORY = 1; EMPTY_DIRECTORY = 2; }
}
message Rename {
  enum Mode { MODE_UNSPECIFIED = 0; NO_REPLACE = 1; REPLACE = 2; }
}
// An absent slot addresses the observed root. A present slot carries the
// canonical address and the parent observation for the final name.
message BoundAttribute { uint64 lookup = 1; uint64 entry = 2; EntrySlot slot = 3; }
message SetPermissions { BoundAttribute target = 1; uint32 mode = 2; }
message ListXattrs { BoundAttribute target = 1; uint32 max_bytes = 2; }
message GetXattr { BoundAttribute target = 1; string name = 2; uint32 max_bytes = 3; }
message SetXattr { BoundAttribute target = 1; string name = 2; XattrWriteMode mode = 3; }
message RemoveXattr { BoundAttribute target = 1; string name = 2; }
message StorageCall {
  uint64 handle = 1;
  reserved 10, 12, 13, 14, 21, 22;
  oneof operation {
    List list = 11;
    BoundAttribute get_permissions = 15;
    SetPermissions set_permissions = 16; ListXattrs list_xattrs = 17;
    GetXattr get_xattr = 18; SetXattr set_xattr = 19; RemoveXattr remove_xattr = 20;
    DirectoryCheckpoint resume_directory = 23;
  }
}
// File-byte range. Absent length reads through EOF; present zero is an empty
// range. Resources retain their original Store/session and are never reopened/replayed.
// Writes stage a whole file until Commit. Unsupported atomic/mode requests fail
// before staging. Commit and Abort are terminal, including errors/cancellation;
// uncertain mutation results are MUTATION_OUTCOME_UNKNOWN and must never be replayed.
enum WriteMode { WRITE_MODE_UNSPECIFIED = 0; CREATE_NEW = 1; REPLACE = 2; }
enum Publication { PUBLICATION_UNSPECIFIED = 0; STAGED = 1; ATOMIC = 2; }
// Each WASM storage Store and gRPC storage session opens exactly one Storage,
// with handle 1. Child handles increase across kinds and are never reused.
message Handle { uint64 handle = 1; }
message Request {
  // Required for gRPC driver calls except Describe and for the Session opening
  // Open handshake. Later session frames leave this empty: the stream owns
  // their resources. A WASM host chooses one per Store and supplies it on every
  // call, including Describe.
  string generation = 1;
  // Binary bytes for WriterChunk/SetXattr only; all other requests leave it empty.
  bytes data = 2;
  reserved 10, 11;
  oneof operation {
    Empty describe = 3; Initialize initialize = 4; Config prepare = 5;
    Migrate migrate = 6; Config test_connection = 7;
    Open open = 8; StorageCall storage = 9;
    Handle reader_next = 12; Handle writer_chunk = 13; Handle commit = 14;
    Handle abort = 15; ResourceRef release = 16;
    LookupHandle begin_lookup = 17; // Storage handle.
    ObserveChild observe_child = 18;
    ReadObservedLink read_observed_link = 19;
    LookupHandle verify_lookup = 20; // Lookup handle.
    BoundCall execute = 21;
  }
}
message Prepared { Object config = 1; Object details = 2; }
message Storage { uint64 handle = 1; StorageInfo info = 2; }
// Page data contains consecutive length-delimited Entry messages. The receiver
// applies the requested page count before decoding each entry.
message Page {
  DirectorySelection reported = 1;
  oneof completion { Empty end = 2; string after = 3; }
}
message Permissions { uint32 mode = 1; }
message Chunk { bool eof = 1; } // eof => empty data; !eof => nonempty data.
// Every response, including describe, storage information and commit, uses this
// envelope. No endpoint returns a bare Description, StorageInfo, Entry or JSON.
message Reply {
  // Names are sorted UTF-8 keys, each terminated by NUL. Bytes are opaque.
  bytes data = 1; // Bytes/Names/Chunk/Page results only.
  oneof result {
    Description description = 2; Prepared prepared = 3; Config config = 4;
    Storage storage = 5; Handle reader = 6; Handle writer = 7;
    Entry entry = 8; Page page = 9; Permissions permissions = 10; Empty names = 11;
    Empty bytes = 12; Chunk chunk = 13; Empty unit = 14; Failure failure = 15;
    DirectorySelection selected_directory = 16;
    OpenedLookup opened_lookup = 17;
    ObservedEntry observed_entry = 18;
  }
}
service Plugin {
  // Driver metadata, initialization, configuration preparation only.
  // Storage resources can only be opened and used through Session.
  rpc Invoke(Request) returns (Reply);
  // One duplex stream owns one Storage and every child reader, writer and lookup. Its first
  // request is Open. Subsequent requests are Storage/Execute/ReaderNext/
  // WriterChunk/Commit/Abort/BeginLookup/ObserveChild/ReadObservedLink/VerifyLookup/Release,
  // with one ordered Reply per request.
  // Requests are serialized within a session; separate Storage sessions run
  // independently. Cancelling an in-flight request closes its entire session,
  // since an uncertain response must never be matched to another request.
  // Closing either direction releases all resources and aborts staged writes.
  // Idle sessions remain valid without heartbeat, renewal or expiry scanning.
  // Resource IDs are local to the stream (Storage is 1) and never reused there.
  rpc Session(stream Request) returns (stream Reply);
}
