[package]
name = "ah-vfs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
testing = []

[dependencies]
ah-id = { workspace = true, features = ["uuid_v7"] }
bon.workspace = true
getset.workspace = true
derive_more = { workspace = true, features = ["std", "display"] }
thiserror.workspace = true
semver.workspace = true
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite-bundled", "runtime-tokio"] }
tokio = { version = "1.54.1", features = ["sync"] }

[dev-dependencies]
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes", "alloc"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt"] }
