[package]
name = "vfs-plugin-grpc"
description = "Authenticated host-side gRPC transport for VFS plugins"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
ah-vfs = { path = "../ah-vfs", version = "0.1.0" }
vfs-plugin-protocol = { path = "../vfs-plugin-protocol", version = "0.1.0" }
vfs-plugin-host = { path = "../vfs-plugin-host", version = "0.1.0" }
vfs-plugin-codec = { path = "../vfs-plugin-codec", version = "0.1.0" }
vfs-plugin-grpc-wire = { path = "../vfs-plugin-grpc-wire", version = "0.1.0" }
serde_json = "1.0.154"
tonic = { version = "0.14", features = ["transport", "tls-ring", "tls-webpki-roots"] }
tokio = { version = "1.54.1", features = ["net", "rt", "sync", "time", "macros"] }
tokio-stream = { version = "0.1.19", features = ["net"] }

