[package]
name = "vfs-plugin-host"
description = "Host-side Driver and Storage proxies for VFS plugins"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
ah-vfs = { path = "../ah-vfs", version = "0.1.0" }
vfs-plugin-protocol = { path = "../vfs-plugin-protocol", version = "0.1.0" }
vfs-plugin-codec = { path = "../vfs-plugin-codec", version = "0.1.0" }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt"] }
